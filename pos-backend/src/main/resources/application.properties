server.port=8080

# === H2 In-Memory Database (swap to PostgreSQL in production) ===
spring.datasource.url=jdbc:h2:file:./data/poslocal;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Force H2 Dialect for Spring Boot 3 compatibility
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# === CORS (allow the PWA frontend) ===
pos.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175

# === Email (configure via Settings UI — overridable at runtime) ===
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# === Sync Settings ===
pos.sync.enabled=true

# === Scheduler ===
# Report schedule (default: 11 PM daily) — overridable via DB config
pos.report.schedule.cron=0 0 23 * * *
pos.report.recipient.email=

# === File storage for exports ===
pos.export.dir=./exports

# === Logging ===
logging.level.com.poslocal=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.mail=DEBUG

# Show SQL queries and their parameters
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.output.ansi.enabled=NEVER
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
