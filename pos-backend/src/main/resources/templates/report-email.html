<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>POS Daily Report</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #eee; border-radius: 8px; }
        .header { background: #e8590c; color: white; padding: 10px 20px; border-radius: 6px 6px 0 0; }
        .content { padding: 20px 0; }
        .footer { font-size: 0.8rem; color: #888; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>POS Local — Daily Report</h2>
        </div>
        <div class="content">
            <p>Hello,</p>
            <p th:text="${body}">The daily report is attached below.</p>
            <p>Please find the Excel attachment containing detailed sales and expense records for today.</p>
        </div>
        <div class="footer">
            <p>This is an automated report from your POS Local system.</p>
        </div>
    </div>
</body>
</html>
